name: cmvijay-agents

on:
  schedule:
    # 14:00 UTC = 19:30 IST daily
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: cmvijay-agents
  cancel-in-progress: false

jobs:
  run-agents:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache agent state
        uses: actions/cache@v4
        with:
          path: agents/state/seen.json
          key: cmvijay-agents-state-${{ github.run_id }}
          restore-keys: |
            cmvijay-agents-state-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic requests feedparser

      - name: Run agents pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cd $GITHUB_WORKSPACE
          python agents/state/orchestrator.py

      - name: Push any autonomous commits
        run: |
          if git log HEAD ^origin/master --oneline | grep .; then
            echo "Autonomous commits detected — pushing"
            git push origin HEAD:master
          else
            echo "No autonomous commits to push"
          fi

      - name: Commit agent logs
        run: |
          if [ -d agents/log ] && [ -n "$(ls -A agents/log 2>/dev/null)" ]; then
            git config user.name "cmvijay-agent"
            git config user.email "cmvijay-agent@users.noreply.github.com"
            git add agents/log/
            git diff --cached --quiet || git commit -m "log: agent run $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:master || true
          fi

      - name: Generate /agents transparency JSON
        run: |
          python agents/log/summarize.py
          if [ -d agents-page ] && [ -n "$(ls agents-page/*.json 2>/dev/null)" ]; then
            git config user.name "cmvijay-agent"
            git config user.email "cmvijay-agent@users.noreply.github.com"
            git add agents-page/*.json
            git diff --cached --quiet || git commit -m "agents-page: refresh stats/entries/corrections JSON"
            git push origin HEAD:master || true
          fi

      - name: Post daily digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f agents/state/daily_digest.md ]; then
            TITLE="cmvijay-agents digest · $(TZ=Asia/Kolkata date '+%Y-%m-%d')"
            BODY=$(cat agents/state/daily_digest.md | python3 -c 'import sys, json; print(json.dumps(sys.stdin.read()))')
            RESPONSE=$(curl -sS -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/issues \
              -d "{\"title\": \"$TITLE\", \"body\": $BODY, \"labels\": [\"agent-digest\"]}")
            echo "$RESPONSE" | head -20
            ISSUE_NUM=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin).get('number', ''))")

            # Auto-close if this was a zero-activity day (nothing committed, nothing escalated)
            # We read the digest markdown for "Autonomous commits: 0" AND "Escalated to operator: 0"
            AUTO_COMMITS=$(grep -oP 'Autonomous commits:\**\s*\K\d+' agents/state/daily_digest.md | head -1 || echo "999")
            ESCALATED=$(grep -oP 'Escalated to operator:\**\s*\K\d+' agents/state/daily_digest.md | head -1 || echo "999")
            if [ "$AUTO_COMMITS" = "0" ] && [ "$ESCALATED" = "0" ] && [ -n "$ISSUE_NUM" ]; then
              echo "Zero-activity digest — auto-closing issue #$ISSUE_NUM"
              curl -sS -X PATCH \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUM \
                -d '{"state": "closed", "state_reason": "not_planned", "labels": ["agent-digest", "quiet-day"]}'
              curl -sS -X POST \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUM/comments \
                -d '{"body": "🌤️ Quiet day — no autonomous commits, no escalations. Auto-closed. Historical record preserved."}'
            fi
          fi
